# Board description of the Samsung Galaxy Tab S9 Ultra (Wi-Fi) (gts9uwifi, SM-X910, SM8550-AC),
# read by the unixnu build driver.
#
# STATUS: skeleton. The UEFI layer (uefi-sheng/Platforms/Samsung/gts9uwifiPkg) builds and the
# boot image packs, but nothing below has been booted on the tablet yet. Every value marked
# PROVEN-DEVICE has to be read off the real SM-X910 before it can be trusted; the rest is
# inherited from UniXNU-sheng, which runs on the same SM8550 SoC.

[board]
name = "gts9uwifi"
soc = "SM8550"
description = "Samsung Galaxy Tab S9 Ultra (Wi-Fi)"
kit = "gts9uwifi"                   # this repository's package/ appears as kits/gts9uwifi in the build tree

# Target OS image. First boot reuses the exact iPad7,1 iPadOS 17.7.11 restore image that the sheng
# port proved out, so the kernel prelink pin and the 4 KiB XNU patches apply unchanged. Switching to
# macOS means pointing this at a macOS restore and updating product/version/build/device_class/
# chip_id/board_id plus the member pins; the kernel, payload, boot image and userdata steps stay.
[ipsw]
url = "https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"
product = "iPad7,1"
version = "17.7.11"
build = "21H461"
device_class = "j120ap"
chip_id = 0x8011
board_id = 12
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]

[ipsw.sha256]
"044-76040-038.dmg" = "3f99b859c9728379110b66657c7b15285bcb1925ad8b5726542e2cdcf8b1028d"
"044-76034-038.dmg" = "b4908cde41d23e6bc05e6af51a2c9eeb00cf0f863a6a18b1600c96a3fd7044f"

# Raw image for the userdata partition: the OS and SystemOS disk images of the IPSW behind a manifest.
# TODO(PROVEN-DEVICE): first_lba/last_lba must be the GPT entry "userdata" on THIS tablet.
# Read them with scripts/read-userdata-lba.sh (TWRP + adb); the values below are sheng's and will be
# overwritten by that script. Declaring them wrong writes outside the partition, so do not build
# the userdata image before the script has run.
[userdata]
first_lba = 0x2f3840
last_lba = 0x3d0abfa
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[kernel]
defconfig = "gts9uwifi_defconfig"
# First-console-boot archive set: SoC-level drivers only. The sheng PMGR power archive, the Adreno
# stack and the mobile display provider are deliberately absent until this board has its own
# evidence for them (see the defconfig).
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-arm-driver.py ArmDTPlatform",
  "build-arm-driver.py ArmCpu",
  "build-arm-driver.py NativeAES",
  "build-native-aes-bindings.py",
  "build-arm-driver.py NativeUfs",
  "build-arm-driver.py NativeVirtioBlock",
  "build-arm-driver.py NativeRamBlock",
  "build-native-virtio-bindings.py --component NativeRamBlock --directory build/native-ram-block",
  "build-native-virtio-bindings.py --component NativeVirtioBlock",
  "build-mockfs-fixture.py",
  "build-boot-progress.py",
  "build-libpthread-kernel.py",
  "build-native-legacy-display.py",
]

[kernel.prelink]
tool = "kits/NativePrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
kernelcache_sha256 = "f18b4df865405f2a287b84977d7aca745e056d656d9fc9df1662970ce2969de7"
slide = "-0x1000000"
early_security_init = "com.apple.driver.AppleMobileFileIntegrity=0xfffffff005ab4ae0"
roots = [
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
  "com.apple.driver.AppleARMPlatform",
  "com.apple.driver.AppleARMWatchdogTimer",
  "com.apple.driver.AppleAudioClockLibs",
  "com.apple.driver.AppleEffaceableStorage",
  "com.apple.driver.AppleIISController",
  "com.apple.driver.AppleM2ScalerCSCDriver",
  "com.apple.driver.AppleMobileFileIntegrity",
  "com.apple.driver.ApplePMGR",
  "com.apple.driver.IODARTFamily",
  "com.apple.filesystems.apfs",
  "com.apple.iokit.CoreAnalyticsFamily",
  "com.apple.iokit.IOAVFamily",
  "com.apple.iokit.IOAudio2Family",
  "com.apple.iokit.IOCECFamily",
  "com.apple.iokit.IOCryptoAcceleratorFamily",
  "com.apple.iokit.IOGPUFamily",
  "com.apple.iokit.IOHDCPFamily",
  "com.apple.iokit.IOMobileGraphicsFamily",
  "com.apple.iokit.IOReportFamily",
  "com.apple.iokit.IOSlowAdaptiveClockingFamily",
  "com.apple.iokit.IOStorageFamily",
  "com.apple.iokit.IOSurface",
  "com.apple.kec.Libm",
  "com.apple.kec.corecrypto",
  "com.apple.kext.AppleMatch",
  "com.apple.kext.CoreTrust",
  "com.apple.security.AppleImage4",
  "com.apple.security.sandbox",
  "com.apple.iokit.IOHIDFamily",
  "com.apple.iokit.IOHIDEventDriver",
]

# The UEFI layer. platform package: uefi-sheng/Platforms/Samsung/gts9uwifiPkg.
[firmware]
config = "gts9uwifi"
dsc = "Platforms/Samsung/gts9uwifiPkg/gts9uwifi.dsc"
fd = "Build/gts9uwifiPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
preflight = ["scripts/check-gts9uwifi.py"]
submodules = ["Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
patches = ["Resources/MuPatches/Gic-Spurious.patch"]
packages = [
  "{uefi}",
  "{uefi}/Platforms/Samsung",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Platforms/Samsung",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
]

[firmware.defines]
ENABLE_SECUREBOOT = "1"
DEVICE_MODEL = "gts9uwifi"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "gts9uwifi-research"

# The ramdisk of the boot image: a FAT volume with the UniXNU config, the kernel, its device tree and
# the optional trust cache and Data seed. DarwinBoot itself lives in the firmware volume.
[payload]
volume = "GTS9UWIFIESP"
size_mib = 192
loader = "firmware"
title = "gts9uwifi first boot: source 4K XNU to console"
dram_size = "0x80000000"            # TODO(PROVEN-DEVICE): confirm against the SM-X910 SMEM RAM table
panic_screen = true
# TODO: replace with the caches of the image actually fetched; the payload step refuses others.
trust_cache_sha256 = [
  "7416ca4f8377146626bb284e2133c76bee6cb4e3ee0af5d648b186235a7323a7",
  "8900d6a93d7a59ce1a872a5c081e559f4240a218f97e12d44d22dda46644d68f",
]
# Kernel arguments: the generic platform/storage/diagnostic set only. No sheng-* argument is carried
# over, because every one of them names a driver that does not exist on this board yet.
kernel_args = [
  "-v",
  "serial=3",
  "debug=0x14e",
  "kt_fixed_zones=120",
  "offline-legacy-register=1",
  "offline-legacy-gop=1",
  "offline-legacy-unit-scale=2",
  "offline-legacy-pm=1",
  "offline-legacy-validate=1",
  "offline-legacy-transfer=1",
  "offline-legacy-cpu-present=1",
  "offline-legacy-phase=4",
  "offline-apfs-load=1",
  "boot-progress=2",
  "-apfs_shared_datavolume",
  "native-ufs-root=1",
  "armcpu-diagnostics=1",
  "armcpu-spi-ipi=1",
  "-no_slto_panic",
  "ml-timeout-lock-panic-scale=40",
]

[payload.adt]
tool = "scripts/make-gts9uwifi-adt.py"
chip_id = "207"                      # 0x207 = SM8550 v1, one of the msm-id pairs in the stock DTB
owned_memory_size = "0x130000000"    # TODO(PROVEN-DEVICE): from the SMEM RAM table
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"
cpu_regs = "0,0x100,0x200,0x300,0x400,0x500,0x600,0x700"
packed_data_ramdisk = true
persistent_data = false
ipad_identity = true
unique_chip_id = "required"          # the platform seed is not stored in any repository

# Image parameters come from the Mu-Silicium device config; [bootimg.image] would override them.

# The stock SM-X910 DTB already carries /reserved-memory/splash_region (0xb8000000, 0x2b00000),
# read from /sys/firmware/fdt on the tablet. It is restated here so a DTB refresh that drops the
# node cannot silently leave the stock ABL without a framebuffer to hand over.
[[bootimg.dtb_node]]
path = "/reserved-memory/splash_region"
props = [
  { name = "label", type = "s", value = "cont_splash_region" },
  { name = "reg", type = "x", value = ["0x0", "0xb8000000", "0x0", "0x2b00000"] },
]
